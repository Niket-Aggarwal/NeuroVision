plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def geminiApiKey = localProperties.getProperty("GEMINI_API_KEY") ?: System.getenv("GEMINI_API_KEY") ?: ""
def geoapifyApiKey = localProperties.getProperty("GEOAPIFY_API_KEY") ?: System.getenv("GEOAPIFY_API_KEY") ?: ""

android {
    namespace "com.visionguide.phone"
    compileSdk 36

    defaultConfig {
        applicationId "com.visionguide.phone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        buildConfigField "String", "DEFAULT_GEMINI_KEY", "\"${geminiApiKey}\""
        buildConfigField "String", "GEOAPIFY_API_KEY", "\"${geoapifyApiKey}\""
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file("release.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword (localProperties.getProperty("KEYSTORE_PASSWORD") ?: "neurovision123")
                keyAlias (localProperties.getProperty("KEY_ALIAS") ?: "neurovision")
                keyPassword (localProperties.getProperty("KEY_PASSWORD") ?: "neurovision123")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            def keystoreFile = rootProject.file("release.jks")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            def keystoreFile = rootProject.file("release.jks")
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    def cameraxVersion = "1.6.0"

    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.26.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
}
